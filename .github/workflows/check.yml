name: UCLA Physics Course Monitor

on:
  schedule:
    - cron: '*/5 * * * *' # Runs automatically in the cloud every 5 minutes
  workflow_dispatch: # Allows manual run testing

jobs:
  check-course:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run UCLA Physics Checker
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python monitor.py
